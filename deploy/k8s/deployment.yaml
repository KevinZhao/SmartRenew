apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartrenew
  namespace: smartrenew
  labels:
    app: smartrenew
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: smartrenew
  template:
    metadata:
      labels:
        app: smartrenew
    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: smartrenew
          image: 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/smartrenew:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: SMARTRENEW_CONFIG_FILE
              value: /etc/smartrenew/config.json
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/smartrenew/config.json
              subPath: config.json
              readOnly: true
            - name: accounts
              mountPath: /etc/smartrenew/accounts
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: smartrenew-config
        - name: accounts
          secret:
            secretName: smartrenew-accounts
        - name: data
          persistentVolumeClaim:
            claimName: smartrenew-data
        - name: tmp
          emptyDir: {}
