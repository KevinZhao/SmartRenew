apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartrenew
  namespace: smartrenew
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:123456789012:certificate/REPLACE_ME
    alb.ingress.kubernetes.io/healthcheck-path: /api/health
    alb.ingress.kubernetes.io/security-groups: sg-REPLACE_ME
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
spec:
  ingressClassName: alb
  rules:
    - host: smartrenew.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartrenew
                port:
                  name: http
