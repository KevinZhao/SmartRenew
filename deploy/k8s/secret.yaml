apiVersion: v1
kind: Secret
metadata:
  name: smartrenew-accounts
  namespace: smartrenew
type: Opaque
stringData:
  # Create with real values:
  # kubectl create secret generic smartrenew-accounts -n smartrenew \
  #   --from-literal=accounts.json='[{"alias":"prod-gpu","account_id":"123456789012","access_key":"AKIA...","secret_key":"...","regions":["us-east-1"]}]'
  accounts.json: '[{"alias":"example","account_id":"123456789012","access_key":"AKIA_REPLACE_ME","secret_key":"REPLACE_ME","regions":["us-east-1"]}]'
---
apiVersion: v1
kind: Secret
metadata:
  name: smartrenew-users
  namespace: smartrenew
type: Opaque
stringData:
  # Login accounts. Generate each hash with:
  #   ./smartrenew -hash-password 'your-password'
  # Then create with real values:
  # kubectl create secret generic smartrenew-users -n smartrenew \
  #   --from-literal=users.json='[{"username":"admin","password_hash":"pbkdf2-sha256$600000$..."}]'
  users.json: '[{"username":"admin","password_hash":"REPLACE_ME_RUN_smartrenew_-hash-password"}]'
